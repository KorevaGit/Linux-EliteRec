name: Linux checks
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y libmp3lame0 libpulse0 libfontconfig1 fonts-dejavu-core
      - run: dotnet restore EliteRec.Linux.slnx
      - run: dotnet build EliteRec.Linux.slnx -c Release --no-restore
      - run: dotnet test EliteRec.Linux.slnx -c Release --no-build --no-restore
